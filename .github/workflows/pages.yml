name: Publicar la página de mods

# Publica docs/ en GitHub Pages solo cuando cambia. Con Pages en "Deploy from a
# branch", GitHub la volvía a publicar con cada push a master, aunque el push fuera
# solo una traducción en Data/.
#
# Necesita Settings → Pages → Source: "GitHub Actions". Si queda en "Deploy from a
# branch", publican los dos a la vez y chocan: el 14-sep el despliegue de GitHub falló
# después de 10 minutos. Por lo mismo docs/ no lleva .nojekyll: sin ese despliegue no
# hay Jekyll que saltear.
#
# No publica docs/ tal como está en el commit: lo rearma pagina-diaria.yml, porque
# docs/solicitudes.html no se commitea (sale de la rama «solicitudes», ver
# Source/LoadFoldersBuilder/Solicitudes.cs). Publicado tal cual, cada push que tocara la
# lista de mods borraría el gráfico de los pedidos hasta la corrida del día siguiente.

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
  # Lo llama loadfolders.yml después de commitear el índice regenerado: ese push lo hace
  # GITHUB_TOKEN, y un push de GITHUB_TOKEN no dispara otros flujos, así que el filtro
  # de arriba no lo vería.
  workflow_call:
    inputs:
      ref:
        description: Commit a publicar
        type: string
        required: true

jobs:
  # Desde loadfolders.yml, github.sha es el push que lo disparó, anterior al commit
  # con el índice nuevo; por eso llega el commit a publicar como input.
  publicar:
    uses: ./.github/workflows/pagina-diaria.yml
    with:
      ref: ${{ inputs.ref || github.sha }}
    permissions:
      contents: read
      pages: write
      id-token: write
