name: Publicar release

# Publica output/ —la copia liviana que carga el juego y se sube al Workshop— como release de
# GitHub, para quien juega sin Steam. Lo llama loadfolders.yml después de regenerar el índice,
# así que sale sola en cada push que cambie el mod.
#
# La release no actualiza el Workshop: Steam no lee GitHub. Eso se sigue subiendo desde el
# juego con 03-subir-al-workshop.cmd.

on:
  workflow_dispatch:
  # loadfolders.yml la llama con el commit que acaba de dejar al día: su push con GITHUB_TOKEN
  # no dispara otros flujos, igual que con la página.
  workflow_call:
    inputs:
      ref:
        description: Commit a publicar
        type: string
        required: true

jobs:
  publicar:
    # windows-latest por lo mismo que loadfolders.yml: el builder arma la ruta del About.xml
    # con la barra invertida cableada y en Linux no encuentra nada.
    runs-on: windows-latest

    permissions:
      contents: write

    # Dos pushes seguidos calcularían el mismo tag: la segunda espera a que termine la primera.
    concurrency:
      group: release
      cancel-in-progress: false

    steps:
      # Con historial y tags: la fecha del tag sale del último commit y hay que saber qué tags
      # ya existen.
      - name: Clonar el repositorio
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Preparar .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # La misma copia que carga el juego: sin UNUSED.xml, sin LoadFolders.Build.yaml y sin
      # comentarios. -copia comprueba antes las rutas y después que no falte ningún archivo.
      - name: Armar la copia liviana
        run: dotnet run --project Source/LoadFoldersBuilder -c Release -- -copia

      - name: Decidir si hay algo nuevo
        id: decidir
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          copia="output/RimWorld Mod Latino"

          # Huella del contenido. Si es la misma de la última release no hay nada que publicar:
          # pasa con un push que solo toca Source/ o con una corrida a mano.
          contenido=$(cd "$copia" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          anterior=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          if [ -n "$anterior" ]; then
            huella=$(gh release view "$anterior" --json body --jq .body | grep -o 'contenido: [0-9a-f]*' | cut -d' ' -f2 || true)
            if [ "$huella" = "$contenido" ]; then
              echo "Sin cambios: la copia es igual a la de $anterior."
              exit 0
            fi
          fi

          # La fecha del último commit de una persona, en su zona horaria: la del bot va en UTC
          # y de noche daría el día siguiente.
          fecha=$(git log --format='%an%x09%ad' --date=format:%Y.%m.%d | awk -F'\t' '$1 != "github-actions[bot]" && !listo {print $2; listo=1}')
          tag="v$fecha"
          n=1
          while git rev-parse -q --verify "refs/tags/$tag" > /dev/null; do
            n=$((n + 1))
            tag="v$fecha.$n"
          done

          mods=$(tail -n +2 "$copia/ModList.tsv" | grep -c .)

          # Las carpetas de mod de un commit con el id de su árbol: Data/<mod> o Data/!<autor>/<mod>.
          carpetas() {
            git -c core.quotepath=off ls-tree -r -d "$1" -- Data | awk -F'\t' '{
              n = split($2, p, "/"); split($1, m, " ")
              if ((n == 2 && p[2] !~ /^!/) || (n == 3 && p[2] ~ /^!/)) print p[n] "\t" m[3]
            }'
          }
          # WorkshopID -> nombre del mod, de la ModList.tsv de un commit.
          nombres() {
            git show "$1:ModList.tsv" | awk -F'\t' 'NR > 1 && $1 != "No ID" {print $1 "\t" $2}'
          }

          # Qué mods cambiaron desde la release anterior: 1 nuevo, 2 actualizado, 3 quitado.
          # Se comparan por nombre de carpeta y no por ruta, porque el Agrupador las mueve a
          # Data/!<autor>; con el mismo árbol, un mod que solo se movió no cuenta como actualizado.
          resumen=""
          if [ -n "$anterior" ]; then
            resumen=$(awk -F'\t' '
              function nombre(carpeta, mapa,   id) {
                if (match(carpeta, / - [0-9]+$/)) {
                  id = substr(carpeta, RSTART + 3)
                  if (id in mapa) return mapa[id]
                }
                return carpeta
              }
              ARGIND == 1 { nombre_ahora[$1] = $2; next }
              ARGIND == 2 { nombre_antes[$1] = $2; next }
              ARGIND == 3 { antes[$1] = $2; next }
              { ahora[$1] = $2 }
              END {
                for (c in ahora) {
                  if (!(c in antes)) print "1\t" nombre(c, nombre_ahora)
                  else if (antes[c] != ahora[c]) print "2\t" nombre(c, nombre_ahora)
                }
                for (c in antes) if (!(c in ahora)) print "3\t" nombre(c, nombre_antes)
              }' <(nombres HEAD) <(nombres "$anterior") <(carpetas "$anterior") <(carpetas HEAD) \
              | LC_ALL=C sort -t$'\t' -k1,1 -k2,2f)
          fi

          # Una sección por tipo, solo si tiene algo. Con más de 20 mods, como después de
          # actualizar todo RML, la lista va plegada.
          seccion() {
            local lista cantidad
            lista=$(awk -F'\t' -v tipo="$1" '$1 == tipo {print "- " $2}' <<< "$resumen")
            [ -n "$lista" ] || return 0
            cantidad=$(wc -l <<< "$lista")
            echo
            if [ "$cantidad" -gt 20 ]; then
              printf '<details><summary>%s (%s)</summary>\n\n%s\n\n</details>\n' "$2" "$cantidad" "$lista"
            else
              printf '**%s (%s)**\n\n%s\n' "$2" "$cantidad" "$lista"
            fi
          }

          # Los cambios van como link a la comparación entre las dos releases, donde GitHub
          # muestra los commits y el diff, y con el resumen de mods. La primera no tiene con qué
          # compararse.
          {
            echo "**$mods mods traducidos.** Lista completa: https://lordmordelon.github.io/RML/"
            if [ -n "$anterior" ]; then
              echo
              echo "Cambios desde la release anterior: [$anterior...$tag](https://github.com/$GITHUB_REPOSITORY/compare/$anterior...$tag)"
              seccion 1 "Mods nuevos"
              seccion 2 "Mods actualizados"
              seccion 3 "Mods quitados"
            fi
            echo
            echo "<!-- contenido: $contenido -->"
          } > notas.md

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Se publica $tag: $mods mods."
          cat notas.md

      # 7z con -mcu=on, para que los nombres vayan en UTF-8 y marcados como tales. Seis carpetas
      # llevan una raya en el nombre (Vanilla Animals Expanded — Royal Animals): guardadas en la
      # codificación vieja de Windows, otra PC las descomprime con otro nombre, LoadFolders.xml
      # no las encuentra y sus traducciones no cargan, sin ningún error.
      - name: Comprimir
        if: steps.decidir.outputs.tag != ''
        working-directory: output
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          7z a -tzip -mcu=on ../RimWorld-Mod-Latino.zip "RimWorld Mod Latino" | Out-Null
          Get-Item ../RimWorld-Mod-Latino.zip | Select-Object Name, Length

      # Con el nombre fijo, releases/latest/download/RimWorld-Mod-Latino.zip baja siempre la última.
      - name: Publicar
        if: steps.decidir.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.decidir.outputs.tag }}
        run: gh release create "$TAG" RimWorld-Mod-Latino.zip --target "$(git rev-parse HEAD)" --title "$TAG" --notes-file notas.md
