name: Regenerar el índice de LoadFolders

# Red de seguridad para lo que entra sin pasar por el extractor: una traducción
# aceptada por PR, un yaml editado a mano, una carpeta borrada de Data. Con la
# traducción rápida el extractor ya regenera el índice al terminar, así que en ese
# caso este flujo corre y no encuentra nada que cambiar.

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      # A propósito no están LoadFolders.xml, ModList.* ni docs/: son justo los archivos
      # que escribe este flujo, y si estuvieran acá su propio commit lo volvería a
      # disparar.
      - 'Data/**'
      - 'About/About.xml'
      - 'Source/LoadFoldersBuilder/**'

jobs:
  regenerar:
    # windows-latest y no ubuntu-latest: Source/LoadFoldersBuilder/Statics.cs arma la
    # ruta como Path.Combine(Location, "About\\About.xml"), con la barra invertida
    # cableada, así que en Linux no encuentra el About.xml y no construye nada.
    runs-on: windows-latest

    permissions:
      contents: write

    outputs:
      # El commit a publicar en Pages, o vacío si no hay nada nuevo en docs/.
      pagina: ${{ steps.commitear.outputs.pagina }}

    steps:
      # Con el historial completo: la lista de mods lleva la fecha del último commit que tocó
      # cada mod, y con el clon superficial de siempre todos quedarían con la fecha del
      # último commit.
      - name: Clonar el repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preparar .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # LoadFoldersBuilder solo depende de YamlDotNet, así que no hace falta clonar
      # el extractor. El que sí lo necesita es FileNameEncoder, que no participa.
      - name: Regenerar
        run: dotnet run --project Source/LoadFoldersBuilder -c Release -- -build

      - name: Commitear si cambió algo
        id: commitear
        shell: bash
        run: |
          if [ -z "$(git status --porcelain LoadFolders.xml ModList.tsv ModList.md docs/index.html)" ]; then
            echo "El índice ya estaba al día."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LoadFolders.xml ModList.tsv ModList.md docs/index.html

          # git status puede marcar un archivo que solo difiere en los saltos de línea; al
          # agregarlo se normaliza y no queda nada. Sin esto, git commit falla y el flujo
          # sale en rojo sin que haya pasado nada malo.
          if git diff --cached --quiet; then
            echo "El índice ya estaba al día (solo cambiaban saltos de línea)."
            exit 0
          fi

          git commit -m "Regenerar el indice de LoadFolders [skip ci]"
          git push

          # Un cambio de fecha en Steam puede tocar solo ModList.*: ahí la página ya está bien.
          if ! git diff --quiet HEAD~1 HEAD -- docs; then
            echo "pagina=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  # Si regenerar no commiteó nada, la página ya está al día: o el push no la tocó, o
  # traía docs/ nuevo y lo publicó pages.yml por su cuenta.
  publicar-pagina:
    needs: regenerar
    if: needs.regenerar.outputs.pagina != ''
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.regenerar.outputs.pagina }}
    permissions:
      contents: read
      pages: write
      id-token: write
