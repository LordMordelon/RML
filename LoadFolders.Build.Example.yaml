# El archivo tiene que llamarse exactamente LoadFolders.Build.yaml. (Este es el de ejemplo, se llama LoadFolders.Build.Example.yaml, y por eso el constructor lo ignora.)
# La carpeta donde está el LoadFolders.Build.yaml es el punto de referencia de la carga: si ahí adentro hay una carpeta Languages, se carga según las reglas de abajo.
# Todos los valores van "entre comillas dobles". YAML admite otras notaciones, pero conviene usar siempre la misma para que no haya confusiones entre quienes editan estos archivos.
# Los campos cuyo comentario empieza con [ ] aceptan varios elementos y se escriben como lista. Los que no lo tienen no admiten lista.
BuildRule: ##
  Binding: ##
    PackageID: ["MoMo.Friends", "Peroro.Daisuki"] #[ ] Esta carpeta se carga junto con los mods que tengan estos packageId.
    Mode: "None" # "All": se carga solo si están cargados todos los mods de PackageID. "Any": alcanza con que esté cargado uno. Obligatorio cuando hay dos o más PackageID; con uno solo da igual, porque el constructor lo trata como "Any".
    Dependency: "Independent" # "Independent": se aplican todas las reglas tal cual, y dentro de esta carpeta solo puede haber reglas "Dependent". "Dependent": esta carpeta se carga junto con la que indique la regla "Independent" de la carpeta que la contiene.
  Order: ##
    After: ["kentington.saveourship2"] #[ ] Si se carga la carpeta asociada a estos packageId, esta se carga después de aquella.
    Before: ["Aoba.DeadManSwitch.Core"] #[ ] Si se carga la carpeta asociada a estos packageId, esta se carga antes que aquella.
  Version: ##
    Default: "1.5" # Versión de RimWorld en la que se carga esta carpeta. También intenta cargarse en las versiones anteriores y posteriores mientras otra regla no se lo impida. Por ejemplo: si otra regla que apunta al mismo PackageID tiene "1.7" como Default, esta carpeta se carga hasta la 1.6.
    LeftBoundary: # Al extenderse hacia versiones anteriores, no pasa de esta.
    RightBoundary: # Al extenderse hacia versiones posteriores, no pasa de esta.
    Designate: #[ ] Además de la versión Default, se carga también en estas.
    Ban: #[ ] No se carga en estas versiones.

# Datos del mod traducido. No intervienen en la carga: sirven únicamente para armar
# ModList.tsv, el índice de qué mods cubre RML. Van en todas las carpetas reales.
Metadata:
  WorkshopID: "1678847247" # El número que aparece en la URL del mod en el workshop de Steam.
  ModName: "Graphics Settings+" # El nombre del mod, tal como figura en su About.xml.
